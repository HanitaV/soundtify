name: Extension Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "extension-v*"
  pull_request:
    paths:
      - "extensions/chromium-cookie-helper/**"
      - "scripts/capture_cli.py"
      - "scripts/package_extension.py"
      - ".github/workflows/extension-release.yml"
      - "README.md"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example extension-v1.0.0"
        required: false
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  EXTENSION_NAME: soundtify-cookie-helper

jobs:
  package-extension:
    name: Package extension and capture CLI
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python sources
        run: python -m compileall main.py src scripts

      - name: Capture CLI preview and update README block
        run: python scripts/capture_cli.py --python python --output docs/assets/cli-preview.svg --readme README.md

      - name: Ensure checked-in CLI capture is current
        shell: pwsh
        run: |
          git diff -- README.md docs/assets/cli-preview.svg
          git diff --quiet -- README.md docs/assets/cli-preview.svg

      - name: Package Chromium extension
        run: python scripts/package_extension.py --name "${{ env.EXTENSION_NAME }}" --out-dir artifacts

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXTENSION_NAME }}
          path: artifacts/*.zip
          if-no-files-found: error

      - name: Upload CLI capture artifact
        uses: actions/upload-artifact@v4
        with:
          name: soundtify-cli-preview
          path: docs/assets/cli-preview.svg
          if-no-files-found: error

  release-extension:
    name: Publish extension release
    needs: package-extension
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/extension-v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: Soundtify Cookie Helper ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
