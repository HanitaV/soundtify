name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v1.0.0"
        required: false
        type: string

permissions:
  contents: write

env:
  APP_NAME: soundtify
  PYTHON_VERSION: "3.12"

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python sources
        run: python -m compileall main.py src

      - name: Build executable with PyInstaller
        run: pyinstaller soundtify.spec --noconfirm --clean

      - name: Package executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path "dist/${{ env.APP_NAME }}.exe" -DestinationPath "artifacts/${{ env.APP_NAME }}-windows-x64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows-x64
          path: artifacts/${{ env.APP_NAME }}-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.APP_NAME }}-windows-x64
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: ${{ env.APP_NAME }} ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          files: artifacts/*.zip
          generate_release_notes: true
